  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Aether Client
        working-directory: fabric-mod
        run: gradle build --no-daemon

      - name: Upload client JAR
        uses: actions/upload-artifact@v4
        with:
          name: AetherClient-JAR
          path: fabric-mod/build/libs/*.jar
          if-no-files-found: error
