
name: Build Aether Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Minecraft client
        run: gradle -p fabric-mod build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AetherClient
          path: fabric-mod/build/libs/*.jar
          if-no-files-found: error
